<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>anymark: logo final</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../../prototype/tokens.css" />
    <style>
      body {
        margin: 0;
        padding: 32px 16px 64px;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.55 var(--font-sans);
      }
      main {
        max-width: 960px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        padding: 24px 16px 12px;
        text-align: center;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
      }
      figure.acc {
        background: var(--accent);
        color: var(--accent-on);
      }
      figure.mono {
        background: #fff;
        color: #16202a;
      }
      figcaption {
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
      }
      figure.acc figcaption {
        color: var(--accent-on);
      }
      .row {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>anymark: logo final (opção B)</h1>
      <p>
        Arquivos gerados por <code>scripts/export-brand.mjs</code>. Os SVGs seguem o tema do sistema
        (claro/escuro).
      </p>
      <div class="grid">
        <figure>
          <img src="logo.svg" height="48" alt="logo" />
          <figcaption>logo.svg</figcaption>
        </figure>
        <figure class="mono">
          <img src="logo-mono.svg" height="48" alt="logo mono" />
          <figcaption>logo-mono.svg (preto em img; herda a cor quando inline)</figcaption>
        </figure>
        <figure>
          <img src="symbol.svg" height="96" alt="símbolo" />
          <figcaption>symbol.svg</figcaption>
        </figure>
        <figure>
          <div class="row">
            <img src="favicon.svg" width="16" height="16" alt="" />
            <img src="favicon.svg" width="32" height="32" alt="" />
            <img src="favicon.svg" width="48" height="48" alt="" />
          </div>
          <figcaption>favicon.svg em 16, 32 e 48 px</figcaption>
        </figure>
        <figure>
          <div class="row">
            <img src="png/apple-touch-icon-180.png" width="90" alt="" />
            <img src="png/icon-192.png" width="96" alt="" />
          </div>
          <figcaption>PNG 180 (bleed) e 192</figcaption>
        </figure>
        <figure class="acc">
          <img src="logo-mono.svg" height="48" alt="" style="color: var(--accent-on)" />
          <figcaption>logo-mono sobre --accent</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
