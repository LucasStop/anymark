version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Types track the minimum supported Node (engines >=22), and TypeScript is pinned to ~6.0.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        dependency-type: development
      runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /examples/nextjs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Types track the minimum supported Node (engines >=22), and TypeScript is pinned to ~6.0.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      nextjs-example:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
