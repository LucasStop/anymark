version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-tooling:
        dependency-type: development
      runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /examples/nextjs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nextjs-example:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
