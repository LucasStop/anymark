name: Release

# Tag v* gera um GitHub Release com o tarball. NÃO publica no npm: a publicação
# é decisão separada (primeiro publish manual, com 2FA do Lucas).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: yarn install --ignore-scripts

      - run: yarn typecheck

      - run: yarn lint

      - run: yarn test

      - run: yarn build

      - name: Pack
        run: yarn pack

      - name: Check the tarball ships dist
        run: tar -tzf ./*.tgz | grep -qx 'package/dist/index.js'

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" ./*.tgz --title "$TAG" --generate-notes
