name: Release

# Tag v* publica no npm (trusted publishing, sem token) e cria o GitHub Release com o
# tarball. O job roda no ambiente `npm`, que exige a aprovação do Lucas; a tag precisa
# ser igual à versão do package.json. Só se cria tag de versão estável.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 traz o npm 11, que o trusted publishing exige (>= 11.5.1).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(node -p "require('./package.json').version")"

      - run: yarn install --ignore-scripts

      - run: yarn typecheck

      - run: yarn lint

      - run: yarn test

      - run: yarn build

      - name: Pack
        run: yarn pack

      - name: Check the tarball ships dist
        run: tar -tzf ./*.tgz | grep -qx 'package/dist/index.js'

      - name: Publish to npm
        run: npm publish ./*.tgz --access public --provenance

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" ./*.tgz --title "$TAG" --generate-notes
